version: "3.8"

services:
  app:
    build: .
    image: task-manager.api
    container_name: azure-app
    restart: always
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: azure
      SPRING_DATASOURCE_URL: jdbc:postgresql://task-manager-project-ginseku.postgres.database.azure.com:5432/postgres?sslmode=require
      SPRING_DATASOURCE_USERNAME: ${AZURESQL_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${AZURESQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      APP_ADMIN_NAME: ${ADMIN_NAME}
      APP_ADMIN_EMAIL: ${ADMIN_EMAIL}
      APP_ADMIN_PASSWORD: ${ADMIN_PASSWORD}

volumes:
  pgdata: