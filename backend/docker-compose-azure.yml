version: "3.8"

services:
  app:
    build: .
    image: task-manager.api
    container_name: task-app
    restart: always
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://testserver1123.database.windows.net:1433;database=taskmanager;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
      SPRING_DATASOURCE_USERNAME: ${AZURESQL_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${AZURESQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}

      APP_ADMIN_NAME: ${ADMIN_NAME}
      APP_ADMIN_EMAIL: ${ADMIN_EMAIL}
      APP_ADMIN_PASSWORD: ${ADMIN_PASSWORD}

volumes:
  pgdata: